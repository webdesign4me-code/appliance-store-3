<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - AeroWarm</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header>
  <div class="logo">Aero<span>Warm</span></div>
  <nav><a href="./index.html">Shop</a></nav>
</header>

<div class="page-section">
  <h2 style="margin-bottom: 16px;">Checkout</h2>

  <div id="summary"></div>

  <div id="checkout-form" style="margin-top: 24px;">
    <label>Full name</label>
    <input type="text" id="customer-name">

    <label>Phone number</label>
    <input type="text" id="customer-phone" placeholder="03XXXXXXXXX">

    <label>Email (optional)</label>
    <input type="email" id="customer-email">

    <label>Shipping address</label>
    <textarea id="shipping-address" rows="3" placeholder="Street, city, postal code"></textarea>

    <label>Payment method</label>
    <select id="payment-method" style="width:100%; padding:10px; border-radius:6px; border:1px solid #d8d3ca; margin-bottom:16px;">
      <option value="cod">Cash on Delivery</option>
      <option value="jazzcash">JazzCash</option>
      <option value="easypaisa">Easypaisa</option>
      <option value="bank">Bank transfer</option>
    </select>

    <div id="payment-instructions" style="background:#fff3e0; border:1px solid #ffd9a8; border-radius:8px; padding:16px; margin-bottom:16px;"></div>

    <div id="transaction-id-wrap">
      <label>Transaction ID / reference number</label>
      <input type="text" id="transaction-id" placeholder="e.g. TXN123456789">
      <p style="font-size:0.8rem; color:#6b7280; margin-top:-8px; margin-bottom:16px;">
        Send the payment first using the details above, then paste the transaction ID from your JazzCash/Easypaisa/bank app here.
      </p>
    </div>

    <button onclick="placeOrder()" style="width:100%; padding:14px; background:#ff8c42; color:#fff; border:none; border-radius:6px; font-size:1rem; cursor:pointer;">
      Place order
    </button>
    <p id="checkout-msg" style="margin-top:12px; color:#c0392b;"></p>
  </div>
</div>

<script src="./js/cart.js"></script>
<script>
const cart = getCart();
const summaryEl = document.getElementById('summary');
let config = {};

if (cart.length === 0) {
  summaryEl.innerHTML = '<p class="empty-msg">Your cart is empty.</p>';
  document.getElementById('checkout-form').style.display = 'none';
} else {
  summaryEl.innerHTML = cart
    .map((i) => `<div class="cart-item"><span>${i.name} x ${i.quantity}</span><span>${formatPKR(i.price * i.quantity)}</span></div>`)
    .join('') + `<div class="cart-total"><span>Total</span><span>${formatPKR(cartTotal())}</span></div>`;

  fetch('/api/config')
    .then((r) => r.json())
    .then((data) => {
      config = data;
      showInstructions();
    });
}

document.getElementById('payment-method').addEventListener('change', showInstructions);

function showInstructions() {
  const method = document.getElementById('payment-method').value;
  const box = document.getElementById('payment-instructions');
  const txnWrap = document.getElementById('transaction-id-wrap');

  if (method === 'cod') {
    box.innerHTML = `You'll pay in cash when your order is delivered. No transaction ID needed.`;
    txnWrap.style.display = 'none';
  } else if (method === 'jazzcash') {
    box.innerHTML = `Send payment to <strong>JazzCash: ${config.jazzcash?.number || '(not set)'}</strong><br>Account name: ${config.jazzcash?.name || '(not set)'}`;
    txnWrap.style.display = 'block';
  } else if (method === 'easypaisa') {
    box.innerHTML = `Send payment to <strong>Easypaisa: ${config.easypaisa?.number || '(not set)'}</strong><br>Account name: ${config.easypaisa?.name || '(not set)'}`;
    txnWrap.style.display = 'block';
  } else {
    box.innerHTML = `Bank transfer to:<br><strong>${config.bank?.bankName || '(not set)'}</strong><br>Title: ${config.bank?.title || '(not set)'}<br>Account #: ${config.bank?.accountNumber || '(not set)'}<br>IBAN: ${config.bank?.iban || '(not set)'}`;
    txnWrap.style.display = 'block';
  }
}

async function placeOrder() {
  const msgEl = document.getElementById('checkout-msg');
  msgEl.textContent = '';

  const payload = {
    items: getCart().map((i) => ({ productId: i.productId, quantity: i.quantity })),
    customerName: document.getElementById('customer-name').value.trim(),
    customerPhone: document.getElementById('customer-phone').value.trim(),
    customerEmail: document.getElementById('customer-email').value.trim(),
    shippingAddress: document.getElementById('shipping-address').value.trim(),
    paymentMethod: document.getElementById('payment-method').value,
    transactionId: document.getElementById('transaction-id').value.trim()
  };

  const needsTransactionId = payload.paymentMethod !== 'cod';

  if (!payload.customerName || !payload.customerPhone || !payload.shippingAddress) {
    msgEl.textContent = 'Please fill in your name, phone, and address.';
    return;
  }
  if (needsTransactionId && !payload.transactionId) {
    msgEl.textContent = 'Please enter the transaction ID.';
    return;
  }

  const res = await fetch('/api/orders/create', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();

  if (res.ok) {
    clearCart();
    document.querySelector('.page-section').innerHTML = `
      <h2>Order received!</h2>
      <p>Your order #${data.orderId} is being verified. Once we confirm your payment, we'll ship it out.</p>
      <a href="/index.html">Continue shopping</a>
    `;
  } else {
    msgEl.textContent = data.error || 'Could not place order.';
  }
}
</script>
</body>
</html>
