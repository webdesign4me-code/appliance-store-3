<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart - AeroWarm</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header>
  <div class="logo">Aero<span>Warm</span></div>
  <nav>
    <a href="./index.html">Shop</a>
    <a href="./cart.html" class="cart-link">Cart (<span id="cart-count">0</span>)</a>
  </nav>
</header>

<div class="page-section">
  <h2 style="margin-bottom: 16px;">Your Cart</h2>
  <div id="cart-items"></div>
  <div class="cart-total" id="cart-total" style="display:none;">
    <span>Total</span>
    <span id="total-amount">Rs 0</span>
  </div>
  <a href="./checkout.html" id="checkout-link" style="display:none;">
    <button style="width:100%; padding:14px; background:#ff8c42; color:#fff; border:none; border-radius:6px; font-size:1rem; cursor:pointer;">
      Proceed to checkout
    </button>
  </a>
</div>

<script src="./js/cart.js"></script>
<script>
function renderCart() {
  const cart = getCart();
  const container = document.getElementById('cart-items');
  const totalRow = document.getElementById('cart-total');
  const checkoutLink = document.getElementById('checkout-link');

  if (cart.length === 0) {
    container.innerHTML = '<p class="empty-msg">Your cart is empty. <a href="/index.html">Go shopping</a></p>';
    totalRow.style.display = 'none';
    checkoutLink.style.display = 'none';
    return;
  }

  container.innerHTML = cart
    .map(
      (item) => `
    <div class="cart-item">
      <div>
        <strong>${item.name}</strong><br>
        <span>${formatPKR(item.price)} x ${item.quantity}</span>
      </div>
      <span class="remove" onclick="removeFromCart(${item.productId}); renderCart();">Remove</span>
    </div>
  `
    )
    .join('');

  document.getElementById('total-amount').textContent = formatPKR(cartTotal());
  totalRow.style.display = 'flex';
  checkoutLink.style.display = 'block';
}

renderCart();
</script>
</body>
</html>
