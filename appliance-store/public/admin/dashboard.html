<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - AeroWarm</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <div class="logo">Aero<span>Warm</span> Admin</div>
  <nav>
    <a href="#" onclick="logout()">Log out</a>
  </nav>
</header>

<div class="page-section" style="max-width: 900px;">

  <div class="filters" style="padding:0 0 20px;">
    <button class="tab-btn active" data-tab="products">Products</button>
    <button class="tab-btn" data-tab="orders">Orders</button>
  </div>

  <div id="products-tab">
    <div class="admin-form">
      <h3 id="form-title" style="margin-bottom:12px;">Add product</h3>
      <input type="hidden" id="product-id">
      <div class="row">
        <input type="text" id="p-name" placeholder="Name">
        <input type="text" id="p-category" list="category-options" placeholder="Category (e.g. fan, heater, iron...)">
        <datalist id="category-options"></datalist>
      </div>
      <textarea id="p-description" placeholder="Description" rows="2"></textarea>
      <div class="row">
        <input type="number" id="p-price" placeholder="Price (PKR)" step="1">
        <input type="number" id="p-stock" placeholder="Stock">
      </div>
      <label>Product photo</label>
      <input type="file" id="p-image-file" accept="image/*">
      <input type="hidden" id="p-image">
      <img id="p-image-preview" style="max-width:120px; max-height:120px; display:none; margin-bottom:12px; border-radius:6px;">
      <div class="row">
        <button onclick="saveProduct()">Save product</button>
        <button onclick="resetForm()" style="background:#6b7280;">Clear</button>
      </div>
    </div>

    <table class="admin-table" id="products-table">
      <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="orders-tab" style="display:none;">
    <table class="admin-table" id="orders-table">
      <thead><tr><th>Order</th><th>Status</th><th>Total</th><th>Customer</th><th>Payment</th><th>Items</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script src="/js/cart.js"></script>
<script>
const token = localStorage.getItem('adminToken');
if (!token) window.location.href = '/admin/login.html';

function authHeaders() {
  return { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` };
}

function logout() {
  localStorage.removeItem('adminToken');
  window.location.href = '/admin/login.html';
}

// ---- Tabs ----
document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('products-tab').style.display = btn.dataset.tab === 'products' ? 'block' : 'none';
    document.getElementById('orders-tab').style.display = btn.dataset.tab === 'orders' ? 'block' : 'none';
    if (btn.dataset.tab === 'orders') loadOrders();
  });
});

// ---- Image upload ----
// Uploads the selected file immediately when chosen, stores the returned URL
// in the hidden p-image field, and shows a preview.
document.getElementById('p-image-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('image', file);

  const res = await fetch('/api/admin/upload', {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}` }, // no Content-Type - browser sets it for FormData
    body: formData
  });
  const data = await res.json();

  if (res.ok) {
    document.getElementById('p-image').value = data.url;
    const preview = document.getElementById('p-image-preview');
    preview.src = data.url;
    preview.style.display = 'block';
  } else {
    alert(data.error || 'Image upload failed');
  }
});

// ---- Category suggestions ----
async function loadCategoryOptions() {
  const res = await fetch('/api/products/categories');
  const categories = await res.json();
  document.getElementById('category-options').innerHTML = categories
    .map((c) => `<option value="${c}">`)
    .join('');
}

// ---- Products ----
async function loadProducts() {
  const res = await fetch('/api/products');
  const products = await res.json();
  const tbody = document.querySelector('#products-table tbody');
  tbody.innerHTML = products
    .map(
      (p) => `
    <tr>
      <td>${p.name}</td>
      <td>${p.category}</td>
      <td>${formatPKR(p.price)}</td>
      <td>${p.stock}</td>
      <td>
        <button class="btn-edit" onclick='editProduct(${JSON.stringify(p)})'>Edit</button>
        <button class="btn-delete" onclick="deleteProduct(${p.id})">Delete</button>
      </td>
    </tr>
  `
    )
    .join('');
}

function editProduct(p) {
  document.getElementById('form-title').textContent = `Edit: ${p.name}`;
  document.getElementById('product-id').value = p.id;
  document.getElementById('p-name').value = p.name;
  document.getElementById('p-category').value = p.category;
  document.getElementById('p-description').value = p.description || '';
  document.getElementById('p-price').value = p.price;
  document.getElementById('p-stock').value = p.stock;
  document.getElementById('p-image').value = p.image_url || '';
  const preview = document.getElementById('p-image-preview');
  if (p.image_url) {
    preview.src = p.image_url;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

function resetForm() {
  document.getElementById('form-title').textContent = 'Add product';
  document.getElementById('product-id').value = '';
  document.getElementById('p-name').value = '';
  document.getElementById('p-category').value = '';
  document.getElementById('p-description').value = '';
  document.getElementById('p-price').value = '';
  document.getElementById('p-stock').value = '';
  document.getElementById('p-image').value = '';
  document.getElementById('p-image-file').value = '';
  document.getElementById('p-image-preview').style.display = 'none';
}

async function saveProduct() {
  const id = document.getElementById('product-id').value;
  const body = JSON.stringify({
    name: document.getElementById('p-name').value,
    category: document.getElementById('p-category').value,
    description: document.getElementById('p-description').value,
    price: parseFloat(document.getElementById('p-price').value),
    stock: parseInt(document.getElementById('p-stock').value, 10),
    imageUrl: document.getElementById('p-image').value
  });

  const url = id ? `/api/admin/products/${id}` : '/api/admin/products';
  const method = id ? 'PUT' : 'POST';

  const res = await fetch(url, { method, headers: authHeaders(), body });
  if (res.ok) {
    resetForm();
    loadProducts();
    loadCategoryOptions();
  } else {
    alert('Failed to save product');
  }
}

async function deleteProduct(id) {
  if (!confirm('Delete this product?')) return;
  const res = await fetch(`/api/admin/products/${id}`, { method: 'DELETE', headers: authHeaders() });
  if (res.ok) loadProducts();
}

// ---- Orders ----
async function loadOrders() {
  const res = await fetch('/api/admin/orders', { headers: authHeaders() });
  if (res.status === 401) return logout();
  const orders = await res.json();
  const tbody = document.querySelector('#orders-table tbody');
  tbody.innerHTML = orders
    .map(
      (o) => `
    <tr>
      <td>#${o.id}</td>
      <td>${o.status}</td>
      <td>${formatPKR(o.total)}</td>
      <td>${o.customer_name || '-'}<br><small>${o.customer_phone || ''}</small></td>
      <td>${o.payment_method || ''}<br><small>Ref: ${o.transaction_id || '-'}</small></td>
      <td>${o.items.map((it) => `${it.product_name} x${it.quantity}`).join('<br>')}</td>
      <td>
        ${
          o.status === 'pending_verification'
            ? `<button class="btn-edit" onclick="verifyOrder(${o.id})">${o.payment_method === 'cod' ? 'Confirm order' : 'Mark paid'}</button>
               <button class="btn-delete" onclick="rejectOrder(${o.id})">Reject</button>`
            : ''
        }
      </td>
    </tr>
  `
    )
    .join('');
}

async function verifyOrder(orderId) {
  const res = await fetch(`/api/admin/orders/${orderId}/verify`, {
    method: 'POST',
    headers: authHeaders()
  });
  const data = await res.json();
  if (res.ok) {
    loadOrders();
    loadProducts(); // stock changed
  } else {
    alert(data.error || 'Failed to update order');
  }
}

async function rejectOrder(orderId) {
  const res = await fetch(`/api/admin/orders/${orderId}/reject`, {
    method: 'POST',
    headers: authHeaders()
  });
  if (res.ok) {
    loadOrders();
  } else {
    alert('Failed to update order');
  }
}

loadProducts();
loadCategoryOptions();
</script>
</body>
</html>
